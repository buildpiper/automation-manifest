apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testdefulthpadata
  namespace: dev1
  labels:
    app: test-hpa
    created-by: buildpiper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 3
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 5
